[project]
name = "pyconjury"
version = "0.1.0"
description = "Manage GitHub Copilot Agent Skill registrations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "tomli-w>=1.0",
]

[project.scripts]
pyconjury = "pyconjury.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyconjury"]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "ty", 
]


# pyproject.toml
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --show-capture=no"
testpaths = ["tests"]


[tool.ruff]
fix = true
line-length = 120

[tool.ruff.lint]

select = ["E", "F", "I"]
ignore = [
    "E501", # Exclude specific rule: Line too long
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]


[tool.ty.rules]
unused-ignore-comment = "ignore"
unused-type-ignore-comment = "ignore"

[tool.uv]
exclude-newer = "1 week"
